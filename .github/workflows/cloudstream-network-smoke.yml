name: One-time CloudStream host smoke test
on:
  push:
    branches: [cloudstream-en-ko]
    paths: ['.github/workflows/cloudstream-network-smoke.yml']
permissions:
  contents: read
jobs:
  check-7movies:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test homepage, movie catalog, and search endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,sys
          targets = [
            ("homepage", "https://7movies.ac/", None),
            ("movie_catalog", "https://7movies.ac/api/discover?page=1&type=movie", "items"),
            ("movie_search", "https://7movies.ac/api/search?v=5&q=Inception", "results"),
          ]
          failures=0
          for name,url,field in targets:
            req=urllib.request.Request(url,headers={
              "User-Agent":"Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Mobile Safari/537.36",
              "Accept":"*/*",
              "Referer":"https://7movies.ac/"
            })
            try:
              with urllib.request.urlopen(req,timeout=12) as response:
                body=response.read(500_000)
                status=response.status
                ctype=response.headers.get("Content-Type","")
              j=json.loads(body) if field else None
              count=len(j.get(field,[])) if field and isinstance(j,dict) and isinstance(j.get(field),list) else None
              ok=(200 <= status < 300 and ((count is not None and count > 0) if field else len(body)>100))
              print(f"SMOKE {name}: status={status} content_type={ctype!r} bytes={len(body)} {field or 'body'}_count={count} ok={ok}",flush=True)
              if not ok:failures+=1
            except Exception as e:
              failures+=1
              print(f"SMOKE {name}: FAILURE {type(e).__name__}: {str(e)[:250]}",flush=True)
          sys.exit(1 if failures else 0)
          PY
